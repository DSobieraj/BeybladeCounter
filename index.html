<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Licznik Beyblade</title>
<style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #111; color: white; }
    .beyblade { display: flex; justify-content: space-between; align-items: center; 
                border-bottom: 1px solid #444; padding: 10px; height: 33vh; }
    .name { font-size: 1.2em; font-weight: bold; }
    .score { font-size: 2em; margin: 5px 0; }
    .buttons { display: flex; flex-wrap: wrap; gap: 5px; }
    button { font-size: 1.2em; padding: 5px 10px; border: none; border-radius: 5px; cursor: pointer; }
    .plus { background: #2ecc71; color: black; }
    .minus { background: #e74c3c; color: black; }
    .undo-btn { width: 100%; padding: 10px; font-size: 1.2em; background: orange; color: black; }
</style>
</head>
<body>

<div id="bey1" class="beyblade">
    <div>
        <div class="name">Beyblade 1</div>
        <div>Punkty: <span class="score" id="score1">0</span></div>
        <div>Przeciwnik: <span class="score" id="opp1">0</span></div>
    </div>
    <div class="buttons">
        <button class="plus" onclick="addPoints(1, 1)">+1</button>
        <button class="plus" onclick="addPoints(1, 2)">+2</button>
        <button class="plus" onclick="addPoints(1, 3)">+3</button>
        <button class="minus" onclick="addPoints(1, -1)">-1</button>
        <button class="minus" onclick="addPoints(1, -2)">-2</button>
        <button class="minus" onclick="addPoints(1, -3)">-3</button>
    </div>
</div>

<div id="bey2" class="beyblade">
    <div>
        <div class="name">Beyblade 2</div>
        <div>Punkty: <span class="score" id="score2">0</span></div>
        <div>Przeciwnik: <span class="score" id="opp2">0</span></div>
    </div>
    <div class="buttons">
        <button class="plus" onclick="addPoints(2, 1)">+1</button>
        <button class="plus" onclick="addPoints(2, 2)">+2</button>
        <button class="plus" onclick="addPoints(2, 3)">+3</button>
        <button class="minus" onclick="addPoints(2, -1)">-1</button>
        <button class="minus" onclick="addPoints(2, -2)">-2</button>
        <button class="minus" onclick="addPoints(2, -3)">-3</button>
    </div>
</div>

<div id="bey3" class="beyblade">
    <div>
        <div class="name">Beyblade 3</div>
        <div>Punkty: <span class="score" id="score3">0</span></div>
        <div>Przeciwnik: <span class="score" id="opp3">0</span></div>
    </div>
    <div class="buttons">
        <button class="plus" onclick="addPoints(3, 1)">+1</button>
        <button class="plus" onclick="addPoints(3, 2)">+2</button>
        <button class="plus" onclick="addPoints(3, 3)">+3</button>
        <button class="minus" onclick="addPoints(3, -1)">-1</button>
        <button class="minus" onclick="addPoints(3, -2)">-2</button>
        <button class="minus" onclick="addPoints(3, -3)">-3</button>
    </div>
</div>

<button class="undo-btn" onclick="undo()">Cofnij ostatnią akcję</button>

<script>
let scores = JSON.parse(localStorage.getItem("beybladeScores")) || {
    1: { you: 0, opp: 0 },
    2: { you: 0, opp: 0 },
    3: { you: 0, opp: 0 }
};
let history = [];

function updateDisplay() {
    for (let i = 1; i <= 3; i++) {
        document.getElementById(`score${i}`).textContent = scores[i].you;
        document.getElementById(`opp${i}`).textContent = scores[i].opp;
    }
}

function saveData() {
    localStorage.setItem("beybladeScores", JSON.stringify(scores));
}

function addPoints(bey, points) {
    history.push(JSON.stringify(scores)); // zapisz stan przed zmianą
    if (points > 0) {
        scores[bey].you += points;
    } else {
        scores[bey].opp += Math.abs(points);
    }
    saveData();
    updateDisplay();
}

function undo() {
    if (history.length > 0) {
        scores = JSON.parse(history.pop());
        saveData();
        updateDisplay();
    }
}

updateDisplay();
</script>

</body>
</html>
