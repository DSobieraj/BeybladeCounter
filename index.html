<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Licznik Beyblade</title>
<style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #111; color: white; }
    .beyblade { display: flex; justify-content: space-between; align-items: center; 
                border-bottom: 1px solid #444; padding: 10px; height: 33vh; }
    .name { font-size: 1.2em; font-weight: bold; }
    .score { font-size: 2em; margin: 5px 0; }
    .buttons { display: flex; flex-wrap: wrap; gap: 5px; }
    button { font-size: 1.4em; padding: 12px 16px; border: none; border-radius: 8px; cursor: pointer; }
    .plus { background: #2ecc71; color: black; flex: 1; }
    .minus { background: #e74c3c; color: black; flex: 1; }
    .undo-btn, .reset-btn { width: 100%; padding: 15px; font-size: 1.4em; margin-top: 5px; }
    .undo-btn { background: orange; color: black; }
    .reset-btn { background: #3498db; color: black; }
    .input-row { margin-top: 5px; }
    input { font-size: 1.2em; padding: 5px; border-radius: 5px; border: none; width: 100%; }
    .score-input { width: 70px; text-align: center; }
</style>
</head>
<body>

<div id="bey1" class="beyblade">
    <div style="flex:1">
        <input type="text" id="name1" placeholder="Beyblade 1" oninput="updateName(1)">
        <div class="input-row">
            Punkty: <input type="number" id="score1" class="score-input" onchange="setScore(1, 'you')">
        </div>
        <div class="input-row">
            Przeciwnik: <input type="number" id="opp1" class="score-input" onchange="setScore(1, 'opp')">
        </div>
    </div>
    <div class="buttons" style="flex:1">
        <button class="plus" onclick="addPoints(1, 1)">+1</button>
        <button class="plus" onclick="addPoints(1, 2)">+2</button>
        <button class="plus" onclick="addPoints(1, 3)">+3</button>
        <button class="minus" onclick="addPoints(1, -1)">-1</button>
        <button class="minus" onclick="addPoints(1, -2)">-2</button>
        <button class="minus" onclick="addPoints(1, -3)">-3</button>
    </div>
</div>

<div id="bey2" class="beyblade">
    <div style="flex:1">
        <input type="text" id="name2" placeholder="Beyblade 2" oninput="updateName(2)">
        <div class="input-row">
            Punkty: <input type="number" id="score2" class="score-input" onchange="setScore(2, 'you')">
        </div>
        <div class="input-row">
            Przeciwnik: <input type="number" id="opp2" class="score-input" onchange="setScore(2, 'opp')">
        </div>
    </div>
    <div class="buttons" style="flex:1">
        <button class="plus" onclick="addPoints(2, 1)">+1</button>
        <button class="plus" onclick="addPoints(2, 2)">+2</button>
        <button class="plus" onclick="addPoints(2, 3)">+3</button>
        <button class="minus" onclick="addPoints(2, -1)">-1</button>
        <button class="minus" onclick="addPoints(2, -2)">-2</button>
        <button class="minus" onclick="addPoints(2, -3)">-3</button>
    </div>
</div>

<div id="bey3" class="beyblade">
    <div style="flex:1">
        <input type="text" id="name3" placeholder="Beyblade 3" oninput="updateName(3)">
        <div class="input-row">
            Punkty: <input type="number" id="score3" class="score-input" onchange="setScore(3, 'you')">
        </div>
        <div class="input-row">
            Przeciwnik: <input type="number" id="opp3" class="score-input" onchange="setScore(3, 'opp')">
        </div>
    </div>
    <div class="buttons" style="flex:1">
        <button class="plus" onclick="addPoints(3, 1)">+1</button>
        <button class="plus" onclick="addPoints(3, 2)">+2</button>
        <button class="plus" onclick="addPoints(3, 3)">+3</button>
        <button class="minus" onclick="addPoints(3, -1)">-1</button>
        <button class="minus" onclick="addPoints(3, -2)">-2</button>
        <button class="minus" onclick="addPoints(3, -3)">-3</button>
    </div>
</div>

<button class="undo-btn" onclick="undo()">⟲ Cofnij ostatnią akcję</button>
<button class="reset-btn" onclick="resetAll()">⟲ Resetuj wszystko</button>

<script>
let data = JSON.parse(localStorage.getItem("beybladeData")) || {
    1: { name: "Beyblade 1", you: 0, opp: 0 },
    2: { name: "Beyblade 2", you: 0, opp: 0 },
    3: { name: "Beyblade 3", you: 0, opp: 0 }
};
let history = [];

function updateDisplay() {
    for (let i = 1; i <= 3; i++) {
        document.getElementById(`name${i}`).value = data[i].name;
        document.getElementById(`score${i}`).value = data[i].you;
        document.getElementById(`opp${i}`).value = data[i].opp;
    }
}

function saveData() {
    localStorage.setItem("beybladeData", JSON.stringify(data));
}

function addPoints(bey, points) {
    history.push(JSON.stringify(data));
    if (points > 0) {
        data[bey].you += points;
    } else {
        data[bey].opp += Math.abs(points);
    }
    saveData();
    updateDisplay();
}

function undo() {
    if (history.length > 0) {
        data = JSON.parse(history.pop());
        saveData();
        updateDisplay();
    }
}

function resetAll() {
    if (confirm("Na pewno chcesz zresetować wszystkie wyniki?")) {
        history.push(JSON.stringify(data));
        for (let i = 1; i <= 3; i++) {
            data[i].you = 0;
            data[i].opp = 0;
        }
        saveData();
        updateDisplay();
    }
}

function updateName(bey) {
    data[bey].name = document.getElementById(`name${bey}`).value;
    saveData();
}

function setScore(bey, who) {
    let val = parseInt(document.getElementById(who === 'you' ? `score${bey}` : `opp${bey}`).value) || 0;
    history.push(JSON.stringify(data));
    data[bey][who] = val;
    saveData();
}

updateDisplay();
</script>

</body>
</html>
